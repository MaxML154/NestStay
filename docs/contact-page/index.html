  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }
    .card {
      max-width: 560px;
      margin: 24px;
      padding: 32px 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { line-height: 1.7; margin: 0 0 12px; color: #e2e8f0; }
    .contacts {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .contact {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(15,23,42,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }
    .contact:hover {
      transform: translateY(-1px);
      background: rgba(15,23,42,0.5);
    }
    .contact .icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 8px;
      padding: 7px;
      box-sizing: border-box;
    }
    .contact .icon svg { display: block; width: 100%; height: 100%; }
    .contact.mail .icon { background: #0078D4; }
    .contact.qq .icon {
      width: 72px;
      height: 40px;
      padding: 4px 6px;
      background: #ffffff;
      border-radius: 8px;
    }
    .contact.qq .icon svg { width: 100%; height: 100%; }
    .contact strong { display: block; font-size: 0.95rem; }
    .contact span { font-size: 0.88rem; color: #99f6e4; word-break: break-all; }
    .hint { margin-top: 16px; font-size: 0.9rem; }
  </style>
